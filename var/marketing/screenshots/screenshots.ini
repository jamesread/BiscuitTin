# Marketing screenshots of the biscuittin X11 window, captured by `make` in
# this directory. Each section is one PNG, taken in order in ONE app session:
# `steps` are the buttons pressed after the previous section's capture, so a
# section starts wherever the one before it left off.
#
# Buttons: up, down, left, right, select, back. The first press after the
# tiles are hidden (back on the home screen) only brings them back.
# Never select a launcher entry: it would try to start the app.
#
# title/description/theme feed screenshot-manifest.yaml (`make manifest`);
# every section needs them.

[DEFAULT]
width = 1920
height = 1080
clock = 20:15
input = xbox
theme = dark
steps =
manifest_project = biscuittin
manifest_base_url = https://raw.githubusercontent.com/jamesread/biscuittin/main/var/marketing/screenshots/

[home]
steps = right
title = Home screen
description = Every app, game and home automation you use on the TV as a big, readable tile, picked with a gamepad, a remote or the arrow keys, over a rotating royalty-free photo.

[home-idle]
steps = back
title = Ambient background
description = When nobody is using it, the tiles fade away to show the photo and its credit, with the clock still visible. Any button brings them back.

[more]
steps = up, down, right, select
title = More menu
description = Integrations, settings, gamepad info and diagnostics are one button away, and every menu works from the sofa with just a d-pad and two buttons.

[settings]
steps = down, select
title = Settings
description = Change the background photos, image credits, control help and the phone web remote on screen; choices are saved without touching your config file.
